services:
  postgres-db:
    image: postgres:18
    container_name: shop-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5446:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: